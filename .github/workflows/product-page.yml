name: Generate Product Page
on:
  push:
    branches:
      - main
  workflow_dispatch:
    - main
    - version/[0-9][0-9]-release

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pages: write
  id-token: write

jobs:
  pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate HTML
        run: |
          set -e
          python -m pip install markdown
          mkdir -p public
          mkdir -p public/artifacts

          cat <<'CSS' > public/site.css
          .top-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #ccc;
            padding: 1rem 0;
          }

          .top-nav a {
            margin-right: 0.5rem;
          }

          .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            gap: 2rem;
            align-items: start;
          }

          .toc {
            position: sticky;
            top: 1rem;
            max-height: calc(100vh - 2rem);
            overflow-y: auto;
            padding: 1rem;
            border-left: 1px solid #ddd;
          }

          .toc ul {
            list-style: none;
            padding-left: 0;
            margin: 0;
          }

          .toc li {
            margin: 0.35rem 0;
          }

          @media (max-width: 900px) {
            .layout {
              grid-template-columns: 1fr;
            }

            .toc {
              position: static;
              border-left: none;
              border-top: 1px solid #ddd;
              padding-top: 1rem;
            }
          }
          CSS

          npm install -g markdown-to-html

          render_nav() {
            local base="$1"
            local home_rel="index.html"
            local artifacts_rel="artifacts/index.html"
            local contributing_rel="contributing.html"
            local milestones_rel="milestones.html"
          
          
                home_rel="index.html"
                artifacts_rel="artifacts/index.html"
                contributing_rel="contributing.html"
                milestones_rel="milestones.html"
          
          
            printf '%s\n' \
              '<nav class="top-nav">' \
              '<a href="https://cdro.github.io/Mini-Synth/">Product Page</a>' \
              "<a href=\"${home_rel}\">Home</a>" \
              "<a href=\"${artifacts_rel}\">Artifacts</a>" \
              "<a href=\"${contributing_rel}\">Contributing</a>" \
              "<a href=\"${milestones_rel}\">Milestones</a>" \
              '<a href="https://github.com/CDRO/Mini-Synth/releases/latest">Download APK</a>' \
              '</nav>'
          }

          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head>'
            echo '<title>Mini-Synth - Product Page</title>'
            echo '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">'
            echo '<link rel="stylesheet" href="site.css">'
            echo '<base href="/Mini-Synth/">'
            echo '</head>'
            echo '<body>'
            render_nav "public"
            echo '<!-- main content -->'
          } > public/index.html
          markdown README.md >> public/index.html
          echo '</body></html>' >> public/index.html

          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head>'
            echo '<title>Contributing - Mini-Synth</title>'
            echo '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">'
            echo '<link rel="stylesheet" href="site.css">'
            echo '<base href="/Mini-Synth/">'
            echo '</head>'
            echo '<body>'
            render_nav "public"
            echo '<!-- main content -->'
          } > public/contributing.html
          markdown CONTRIBUTING.md >> public/contributing.html
          echo '</body></html>' >> public/contributing.html

          {
            echo '<!DOCTYPE html>'
            echo '<html>'
            echo '<head>'
            echo '<title>Milestones - Mini-Synth</title>'
            echo '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">'
            echo '<link rel="stylesheet" href="site.css">'
            echo '<base href="/Mini-Synth/">'
            echo '</head>'
            echo '<body>'
            render_nav "public"
            echo '<h1>Project Milestones</h1>'
          } > public/milestones.html
          markdown docs/artifacts/MASTER_PLAN.md >> public/milestones.html
          echo '</body></html>' >> public/milestones.html

          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from collections import defaultdict

          import markdown

          docs_root = Path('docs/artifacts')
          public_root = Path('public')
          artifact_root = public_root / 'artifacts'
          artifact_root.mkdir(parents=True, exist_ok=True)

          def slugify(value: str) -> str:
              value = value.lower().strip()
              value = re.sub(r'[^a-z0-9\s-]', '', value)
              value = re.sub(r'[\s_]+', '-', value)
              return value.strip('-') or 'section'

          def folder_title(path: Path) -> str:
              if path == Path('.'):
                  return 'Artifacts'
              return path.name.replace('_', ' ').replace('-', ' ').title()

          def natural_sort_key(value: str):
              parts = re.split(r'(\d+)', value)
              return [int(part) if part.isdigit() else part.lower() for part in parts]

          def art_nav(base_dir: Path) -> str:
              home_href = os.path.relpath(public_root / 'index.html', base_dir)
              artifact_href = os.path.relpath(artifact_root / 'index.html', base_dir)
              contributing_href = os.path.relpath(public_root / 'contributing.html', base_dir)
              milestones_href = os.path.relpath(public_root / 'milestones.html', base_dir)
              project_href = 'https://cdro.github.io/Mini-Synth/'
              return (
                  '<nav class="top-nav">'
                  f'<a href="{project_href}">Product Page</a>'
                  f'<a href="{home_href}">Home</a>'
                  f'<a href="{artifact_href}">Artifacts</a>'
                  f'<a href="{contributing_href}">Contributing</a>'
                  f'<a href="{milestones_href}">Milestones</a>'
                  '<a href="https://github.com/CDRO/Mini-Synth/releases/latest">Download APK</a>'
                  '</nav>'
              )

          def render_markdown(path: Path) -> str:
              return markdown.markdown(path.read_text(encoding='utf-8'), extensions=['extra', 'sane_lists'])

          grouped = defaultdict(list)
          for md in sorted(docs_root.rglob('*.md'), key=lambda item: natural_sort_key(item.as_posix())):
              grouped[md.relative_to(docs_root).parent].append(md)

          folder_links = []
          for folder, files in sorted(grouped.items(), key=lambda item: natural_sort_key(item[0].as_posix())):
              page_dir = artifact_root / folder
              page_dir.mkdir(parents=True, exist_ok=True)

              if folder == Path('.'):
                  continue

              sorted_files = sorted(files, key=lambda item: natural_sort_key(item.name))
              toc_items = []
              sections = []
              page_target = page_dir / 'index.html'
              relative_folder = 'artifacts' / folder
              for file in sorted_files:
                  label = file.stem.replace('_', ' ').replace('-', ' ').title()
                  anchor = slugify(label)
                  toc_items.append(f'<li><a href="{relative_folder.as_posix()}#{anchor}">{label}</a></li>')
                  sections.append(f'<section id="{anchor}"><h2>{label}</h2>{render_markdown(file)}</section>')

              page_html = (
                  '<!DOCTYPE html>'
                  '<html><head>'
                  '<meta charset="utf-8">'
                  f'<title>{folder_title(folder)}</title>'
                  '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">'
                  '<base href="/Mini-Synth/">'
                  f'<link rel="stylesheet" href="site.css">'
                  '</head><body>'
                  + art_nav(page_dir)
                  + '<div class="layout"><main><h1>' + folder_title(folder) + '</h1>' + ''.join(sections) + '</main>'
                  + '<aside class="toc"><h3>Contents</h3><ul>' + ''.join(toc_items) + '</ul></aside></div></body></html>'
              )
              page_target.write_text(page_html, encoding='utf-8')
              folder_links.append((folder.as_posix(), page_target.relative_to(public_root).as_posix(), folder_title(folder)))

          folder_links = sorted(folder_links, key=lambda item: natural_sort_key(item[0]))

          artifact_index = artifact_root / 'index.html'
          artifact_index.write_text(
              '<!DOCTYPE html>'
              '<html><head>'
              '<meta charset="utf-8">'
              '<title>Mini-Synth Artifacts</title>'
              '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">'
              '<base href="/Mini-Synth/">'
              f'<link rel="stylesheet" href="site.css">'
              '<style>'
              '.content { max-width: 1100px; margin: 0 auto; }'
              '</style>'
              '</head><body>'
              + art_nav(artifact_root)
              + '<div class="content"><h1>Artifacts</h1><ul>'
              + ''.join(f'<li><a href="{page_rel}">{label}</a></li>' for _, page_rel, label in folder_links)
              + '</ul></div></body></html>',
              encoding='utf-8',
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    needs: pages
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
